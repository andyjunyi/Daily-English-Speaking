<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地道英文 · 口語短句學習</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fef9ef;
    --surface: #ffffff;
    --surface2: #fff5e6;
    --border: #f0d9b5;
    --text: #3d2b1f;
    --muted: #8b7a62;
    --accent: #f4a261;
    --accent2: #e76f51;
    --accent3: #2a9d8f;
    --beginner: #2a9d8f;
    --intermediate: #e9c46a;
    --advanced: #e76f51;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
  }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(254,249,239,0.95);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--text);
  }
  .logo span { color: var(--accent); }
  .nav-stats {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  /* HERO */
  .hero {
    padding: 60px 40px 40px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 12px;
  }
  .hero h1 em {
    font-style: normal;
    color: var(--accent);
  }
  .hero p {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 32px;
  }

  /* SEARCH */
  .search-bar {
    display: flex;
    gap: 12px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 18px;
    max-width: 560px;
    transition: border-color 0.2s;
  }
  .search-bar:focus-within {
    border-color: var(--accent);
  }
  .search-bar input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 0.95rem;
    font-family: 'Noto Sans TC', sans-serif;
    flex: 1;
  }
  .search-bar input::placeholder { color: var(--muted); }
  .search-icon { color: var(--muted); font-size: 1rem; }

  /* FILTERS */
  .filters {
    padding: 24px 40px;
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: center;
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-label {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
  }
  .chip {
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 0.78rem;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
  }
  .chip.level-beginner.active { background: var(--beginner); border-color: var(--beginner); }
  .chip.level-intermediate.active { background: var(--intermediate); border-color: var(--intermediate); color: #3d2b1f; }
  .chip.level-advanced.active { background: var(--advanced); border-color: var(--advanced); }

  /* RESULTS INFO */
  .results-info {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 40px 16px;
    font-size: 0.78rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  /* MAIN */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 40px 80px;
  }

  /* CATEGORY SECTION */
  .category-section {
    margin-bottom: 48px;
  }
.category-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .category-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }
  .category-subtitle {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .category-count {
    margin-left: auto;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }

  /* CARDS GRID */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  /* CARD */
  .card {
    perspective: 800px;
    height: 140px;
    cursor: pointer;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }
  .card-front, .card-back {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 12px;
    padding: 18px 20px;
    border: 1px solid var(--border);
    background: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: border-color 0.2s, background 0.2s;
  }
  .card:hover .card-front,
  .card:hover .card-back {
    border-color: var(--accent);
    box-shadow: 0 4px 16px rgba(244,162,97,0.15);
  }
  .card-back {
    transform: rotateY(180deg);
    border-color: var(--accent);
    background: linear-gradient(135deg, #fff5e6 0%, #ffffff 100%);
  }

  .card-en {
    font-family: 'DM Mono', monospace;
    font-size: 0.95rem;
    color: var(--text);
    line-height: 1.4;
    font-weight: 500;
  }
  .card-zh-back {
    font-size: 1rem;
    color: var(--accent);
    font-weight: 700;
    line-height: 1.4;
  }
  .card-en-back {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 6px;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .level-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .level-dot.beginner { background: var(--beginner); }
  .level-dot.intermediate { background: var(--intermediate); }
  .level-dot.advanced { background: var(--advanced); }
  .level-text {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
  }
  .tag-chip {
    font-size: 0.63rem;
    padding: 2px 7px;
    border-radius: 4px;
    background: #fef9ef;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .flip-hint {
    font-size: 0.65rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    text-align: right;
    opacity: 0.5;
  }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty .icon { font-size: 3rem; margin-bottom: 16px; }
  .empty p { font-size: 0.9rem; }

  /* SCROLL TOP */
  .scroll-top {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 44px;
    height: 44px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(244,162,97,0.3);
    transition: transform 0.2s;
  }
  .scroll-top:hover { transform: translateY(-3px); }
  .scroll-top.visible { display: flex; }

  @media (max-width: 600px) {
    nav { padding: 16px 20px; }
    .hero, .filters, .results-info, main { padding-left: 20px; padding-right: 20px; }
    .hero { padding-top: 40px; }
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

{"id":"opp-03","en":"Make the most of it.","zh":"榨乾這個機會的價值。","tags":["機會","激勵"],"level":"intermediate"}
]}
]};

// State
let activeLevel = 'all';
let activeTag = 'all';
let searchQuery = '';

// Collect all unique tags
const allTags = [...new Set(DATA.categories.flatMap(c => c.phrases.flatMap(p => p.tags)))].sort();
const totalPhrases = DATA.categories.reduce((s, c) => s + c.phrases.length, 0);

// Build tag filters
const tagFilters = document.getElementById('tagFilters');
const allTagBtn = document.createElement('button');
allTagBtn.className = 'chip active';
allTagBtn.dataset.tag = 'all';
allTagBtn.textContent = '全部';
tagFilters.appendChild(allTagBtn);
allTags.forEach(tag => {
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.dataset.tag = tag;
  btn.textContent = tag;
  tagFilters.appendChild(btn);
});

// Nav stats
document.getElementById('navStats').textContent = DATA.categories.length + ' 主題 · ' + totalPhrases + ' 短句';

// Filter chips
document.querySelectorAll('[data-level]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-level]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeLevel = btn.dataset.level;
    render();
  });
});
tagFilters.addEventListener('click', e => {
  if (!e.target.dataset.tag) return;
  document.querySelectorAll('[data-tag]').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeTag = e.target.dataset.tag;
  render();
});

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim().toLowerCase();
  render();
});

// Render
function render() {
  const main = document.getElementById('main');
  const resultsInfo = document.getElementById('resultsInfo');
  let totalShown = 0;
  let html = '';

  DATA.categories.forEach(cat => {
    const filtered = cat.phrases.filter(p => {
      if (activeLevel !== 'all' && p.level !== activeLevel) return false;
      if (activeTag !== 'all' && !p.tags.includes(activeTag)) return false;
      if (searchQuery) {
        return p.en.toLowerCase().includes(searchQuery) || p.zh.includes(searchQuery);
      }
      return true;
    });
    if (!filtered.length) return;
    totalShown += filtered.length;

    html += '<div class="category-section">';
    html += '  <div class="category-header">';
    html += '    <span class="category-title">' + cat.title + '</span>';
    html += '    <span class="category-subtitle">' + cat.subtitle + '</span>';
    html += '    <span class="category-count">' + filtered.length + ' 句</span>';
    html += '  </div>';
    html += '  <div class="cards-grid">';

    filtered.forEach(p => {
      const levelMap = { beginner: '入門', intermediate: '中級', advanced: '進階' };
      const tagsHtml = p.tags.map(t => '<span class="tag-chip">' + t + '</span>').join('');
      html += '<div class="card" id="card-' + p.id + '" onclick="flipCard(\'' + p.id + '\')">';
      html += '  <div class="card-inner">';
      html += '    <div class="card-front">';
      html += '      <div class="card-en">' + p.en + '</div>';
      html += '      <div class="card-meta">';
      html += '        <span class="level-dot ' + p.level + '"></span>';
      html += '        <span class="level-text">' + levelMap[p.level] + '</span>';
      html += '        ' + tagsHtml;
      html += '        <span class="flip-hint" style="margin-left:auto">點擊翻面</span>';
      html += '      </div>';
      html += '    </div>';
      html += '    <div class="card-back">';
      html += '      <div>';
      html += '        <div class="card-zh-back">' + p.zh + '</div>';
      html += '        <div class="card-en-back">' + p.en + '</div>';
      html += '      </div>';
      html += '      <div class="card-meta">';
      html += '        <span class="level-dot ' + p.level + '"></span>';
      html += '        <span class="level-text">' + levelMap[p.level] + '</span>';
      html += '        ' + tagsHtml;
      html += '        <span class="flip-hint" style="margin-left:auto">點擊收起</span>';
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';
    });

    html += '  </div>';
    html += '</div>';
  });

  if (!totalShown) {
    html = '<div class="empty"><div class="icon">🔍</div><p>沒有符合條件的短句，試試其他關鍵字或篩選條件</p></div>';
    resultsInfo.textContent = '';
  } else {
    resultsInfo.textContent = '顯示 ' + totalShown + ' / ' + totalPhrases + ' 個短句';
  }

  main.innerHTML = html;
}

function flipCard(id) {
  var el = document.getElementById('card-' + id);
  if (el) el.classList.toggle('flipped');
}

// Scroll top
window.addEventListener('scroll', function() {
  var btn = document.getElementById('scrollTop');
  if (window.scrollY > 400) {
    btn.classList.add('visible');
  } else {
    btn.classList.remove('visible');
  }
});

render();
</script>
</body>
</html>
